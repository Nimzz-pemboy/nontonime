<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f16"/>
      <stop offset="50%" stop-color="#161625"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e63"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="f2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="p1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="500" height="500" rx="40" fill="url(#g1)"/>
  <rect width="500" height="500" rx="40" fill="url(#p1)"/>
  <g filter="url(#f2)">
    <circle cx="250" cy="170" r="80" fill="none" stroke="url(#g2)" stroke-width="5" filter="url(#f1)"/>
    <circle cx="250" cy="170" r="65" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="8, 8"/>
    <path d="M 220,120 L 220,220 L 310,170 Z" fill="url(#g2)" filter="url(#f1)"/>
    <path d="M 170 170 A 80 80 0 0 1 193 113" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 330 170 A 80 80 0 0 1 307 227" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <text x="250" y="320" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
      nonton<tspan fill="#ff2e63">ime</tspan>
    </text>
    <text x="250" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#a0aab2" text-anchor="middle" letter-spacing="6">
      ANIME WATCH FREE
    </text>
    <text x="250" y="405" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ff2e63" text-anchor="middle" letter-spacing="4" opacity="0.9">
      アニメストリーミング
    </text>
    <line x1="150" y1="450" x2="350" y2="450" stroke="url(#g2)" stroke-width="2" opacity="0.5"/>
    <circle cx="250" cy="450" r="4" fill="#ff2e63" filter="url(#f1)"/>
    <circle cx="150" cy="450" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="350" cy="450" r="2" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
